function rng(seed){let s=seed>>>0;return ()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}

function burst(x,y,color='#55eaff',count=45,force=1){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=(1+Math.random()*5)*force;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*35,max:60,size:1+Math.random()*4,color})}rings.push({x,y,r:5,life:26,color})}
function connect(a,b){let A=center(a),B=center(b);beams.push({A,B,life:20});burst(B.x,B.y,puzzle.targets.includes(b)?'#ffcb47':'#43eaff',puzzle.targets.includes(b)?65:22,.9)}
function frame(){animation=requestAnimationFrame(frame);c.clearRect(0,0,w,h);c.save();if(shake>0.1){c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.83}else shake=0;for(let i=beams.length-1;i>=0;i--){let b=beams[i],alpha=b.life/20;c.globalAlpha=alpha;c.shadowBlur=24;c.shadowColor='#18dfff';c.strokeStyle='#15aeff';c.lineWidth=13*alpha;c.beginPath();c.moveTo(b.A.x,b.A.y);c.lineTo(b.B.x,b.B.y);c.stroke();c.strokeStyle='#e2ffff';c.lineWidth=4*alpha;c.stroke();b.life--;if(b.life<=0)beams.splice(i,1)}c.shadowBlur=0;for(let i=rings.length-1;i>=0;i--){let r=rings[i];c.globalAlpha=r.life/26;c.strokeStyle=r.color;c.lineWidth=2+r.life/10;c.shadowBlur=17;c.shadowColor=r.color;c.beginPath();c.arc(r.x,r.y,r.r,0,Math.PI*2);c.stroke();r.r+=5;r.life--;if(r.life<=0)rings.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];c.globalAlpha=Math.max(0,p.life/p.max);c.fillStyle=p.color;c.shadowBlur=13;c.shadowColor=p.color;c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill();p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy*=.975;p.life--;if(p.life<=0)particles.splice(i,1)}c.shadowBlur=0;if(cinematicStart){let elapsed=performance.now()-cinematicStart;if(elapsed<cinematicDuration){let idx=Math.min(11,Math.floor(elapsed/cinematicDuration*12));let sz=Math.min(w*1.65,550),px=w/2-sz/2,py=h/2-sz/2;c.globalAlpha=Math.min(1,(cinematicDuration-elapsed)/250);c.globalCompositeOperation='screen';if(overloadSprite.complete&&overloadSprite.naturalWidth)c.drawImage(overloadSprite,(idx%4)*320,Math.floor(idx/4)*320,320,320,px,py,sz,sz);c.globalCompositeOperation='source-over';c.globalAlpha=1}else cinematicStart=0}drawPlasma();if(flash>.005){c.globalAlpha=flash*.65;c.fillStyle='#c4faff';c.fillRect(0,0,w,h);flash*=.78}c.restore();c.globalAlpha=1}frame();
function status(s){$('status').textContent=s}function draw(){let b=$('board');b.innerHTML='';b.style.gridTemplateColumns=`repeat(${N},minmax(0,1fr))`;for(let i=0;i<N*N;i++){let el=document.createElement('button');el.type='button';el.className='tile'+(i===puzzle.start?' core':i===puzzle.end?' portal':puzzle.targets.includes(i)?' star':'');el.disabled=busy||completed||i===puzzle.end;let a=document.createElement('span');a.className='arrow';a.textContent='↑';a.style.setProperty('--rotation',(arrows[i]*90)+'deg');el.append(a);if(i===puzzle.start||i===puzzle.end){let tag=document.createElement('span');tag.className='tag';tag.textContent=i===puzzle.start?'GO':'END';el.append(tag)}el.setAttribute('aria-label','Tile '+(i+1)+' '+GLYPHS[arrows[i]]);el.onclick=()=>rotate(i);b.append(el)}$('level').textContent=level+1;$('moves').textContent=remaining;$('targets').textContent=puzzle.targets.length;$('launch').disabled=busy||completed;resize()}
function rotate(i){if(busy||completed)return;if(!remaining){status('No rotations left. Launch or reset.');return}arrows[i]=(arrows[i]+1)%4;remaining--;sweep(460,170,.1,.11);crackle(.07,.35);draw();let P=center(i);burst(P.x,P.y,'#48f4ff',8,.45);status(remaining+' rotations remaining. Plan the route before launching.')}
function trace(){let path=[puzzle.start],seen=new Set(path);for(let step=0;step<N*N;step++){let here=path.at(-1);if(here===puzzle.end)break;let [dr,dc]=DIRS[arrows[here]],r=(here/N|0)+dr,col=here%N+dc;if(r<0||r>=N||col<0||col>=N)break;let next=r*N+col;if(seen.has(next))break;path.push(next);seen.add(next)}return path}
const sleep=t=>new Promise(r=>setTimeout(r,t));async function launch(){if(busy||completed)return;busy=true;draw();sound();status('⚡ ELECTRIC CHAIN ACTIVATED');playFx('charge',.9);sweep(80,950,.45,.18);crackle(.6,.65);let route=trace();for(let i=0;i<route.length;i++){let node=route[i];if(i>0)connect(route[i-1],node);let p=center(node);burst(p.x,p.y,puzzle.targets.includes(node)?'#ffd24b':'#6efcff',puzzle.targets.includes(node)?45:14,.7);sweep(210+i*32,75+i*20,.15,.08);if(puzzle.targets.includes(node)){crackle(.14,.3);playFx('spark',.75)}await sleep(150)}let won=route.at(-1)===puzzle.end&&puzzle.targets.every(t=>route.includes(t));if(won){completed=true;status('REACTOR CRITICAL — CINEMATIC OVERLOAD!');let p=center(puzzle.end);await sleep(220);cinematicStart=performance.now();ignitePlasma();electricImpact(.45);boom(.4);burst(p.x,p.y,'#ffffff',190,2.5);burst(p.x,p.y,'#e65cff',130,1.8);burst(p.x,p.y,'#ffce4b',90,1.5);for(let k=0;k<3;k++){await sleep(380);burst(w*.5,h*.43,'#ffcf4d',65,1.5);crackle(.2,.7);sweep(310+k*150,550+k*190,.28,.12,'triangle')}await sleep(850);$('winmsg').textContent='All '+puzzle.targets.length+' energy stars collected • '+remaining+' rotations remaining';$('overlay').classList.add('show')}else{status('Not yet: '+puzzle.targets.filter(t=>!route.includes(t)).length+' stars missed. Adjust the arrows or reset.');sweep(220,65,.3,.12)}busy=false;draw()}
function reset(){puzzle=makePuzzle(level);arrows=puzzle.initial.slice();remaining=puzzle.budget;busy=false;completed=false;particles=[];rings=[];beams=[];cinematicStart=0;$('overlay').classList.remove('show');$('intro').style.display='flex';$('intro').style.animation='none';void $('intro').offsetWidth;$('intro').style.animation='out .55s 1.8s forwards';status('Collect '+puzzle.targets.length+' stars and reach END. '+remaining+' rotations available.');draw();setTimeout(()=>{playFx('startup',.65);sweep(75,570,.65,.08);crackle(.5,.55);for(let i=0;i<Math.min(10,N*N);i++){let P=center(i);burst(P.x,P.y,'#46dfff',8,.4)}},300)}
$('launch').onclick=launch;$('reset').onclick=$('restart').onclick=reset;$('next').onclick=()=>{level=(level+1)%40;reset()};$('hint').onclick=()=>{let wrong=puzzle.path.slice(0,-1).find(i=>arrows[i]!==puzzle.solution[i]);if(wrong===undefined){status('Route aligned. Launch it!');return}let row=(wrong/N|0)+1,col=wrong%N+1;status('💡 Hint: row '+row+', column '+col+' should point '+GLYPHS[puzzle.solution[wrong]]);let P=center(wrong);burst(P.x,P.y,'#ffd04d',30,.5)};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(!muted)sound()};$('volume').oninput=e=>volume=Number(e.target.value)/100;

reset();
</script></body></html>
